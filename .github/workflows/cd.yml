name: CD

# Deploy pipeline: runs when a PR is merged into main (push to main), or manually.
# Strategy is blue-green via Container Apps revisions:
#   1. Build + push the image to GHCR (the deployment artifact).
#   2. Deploy a NEW revision that receives 0% traffic.
#   3. Smoke-test that revision on its own URL.
#   4. Only if the smoke test passes, shift 100% traffic to it (promote).
#   5. On any failure, keep traffic on the previous revision and deactivate the
#      bad one — production is never cut over to a broken build.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # required for Azure OIDC login
  contents: read
  packages: write # required to push the image to GHCR

jobs:
  build:
    name: Build & push image (GHCR)
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image reference
        id: image
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "repo=ghcr.io/${REPO}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Builds the Dockerfile and pushes the image to GHCR. This is our
      # deployment artifact. The package must be set to PUBLIC once (see
      # docs/cicd.md) so Container Apps can pull it anonymously.
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.repo }}:${{ github.sha }}
            ${{ steps.image.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Manual-approval gate. Binding a job to the `production` environment makes it
  # pause until a required reviewer approves. We keep this on a standalone job
  # (rather than on `deploy`) so the deploy job's OIDC subject stays
  # ...:ref:refs/heads/main and reuses the existing Azure federated credential —
  # a job bound to an environment would instead present ...:environment:production.
  approval:
    name: Await deploy approval
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://friendly-holdem.bravesmoke-9c27d4cf.centralus.azurecontainerapps.io
    steps:
      - run: echo "Deployment to production approved."

  deploy:
    name: Deploy, smoke test & promote
    needs: [build, approval]
    runs-on: ubuntu-latest
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP: ${{ vars.AZURE_CONTAINER_APP }}
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # Node + deps are needed to run the Playwright smoke test.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright (chromium only)
        run: pnpm exec playwright install --with-deps chromium

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify the Container App exists
        run: |
          az containerapp show -n "$APP" -g "$RG" >/dev/null 2>&1 || {
            echo "::error::Container App '$APP' not found in resource group '$RG'."
            echo "::error::Provision infra first — see infra/README.md (Pulumi) or docs/cicd.md."
            exit 1
          }

      # The image lives in a public GHCR package, so Container Apps pulls it
      # anonymously — no registry credentials to configure.
      - name: Enable multiple-revision mode
        run: az containerapp revision set-mode -n "$APP" -g "$RG" --mode multiple

      # Pin traffic explicitly to the CURRENT revision before deploying. This
      # converts single-mode's implicit "latest revision" routing into an
      # explicit weight, so the new revision we deploy next starts at 0% and the
      # blue-green + rollback logic holds even on the first CD run.
      - name: Pin traffic to current revision (blue-green baseline)
        run: |
          PREV=$(az containerapp show -n "$APP" -g "$RG" \
            --query properties.latestReadyRevisionName -o tsv 2>/dev/null || true)
          echo "Current stable revision: ${PREV:-<none>}"
          echo "PREV_REVISION=$PREV" >> "$GITHUB_ENV"
          if [ -n "$PREV" ]; then
            az containerapp ingress traffic set -n "$APP" -g "$RG" \
              --revision-weight "${PREV}=100"
          fi

      - name: Deploy new revision (0% traffic)
        run: |
          SUFFIX=$(echo "${{ github.sha }}" | cut -c1-8)
          NEW_REVISION="${APP}--${SUFFIX}"
          az containerapp update -n "$APP" -g "$RG" \
            --image "$IMAGE" \
            --revision-suffix "$SUFFIX"
          FQDN=$(az containerapp revision show -n "$APP" -g "$RG" \
            --revision "$NEW_REVISION" --query properties.fqdn -o tsv)
          echo "New revision: $NEW_REVISION"
          echo "New revision URL: https://$FQDN"
          echo "NEW_REVISION=$NEW_REVISION" >> "$GITHUB_ENV"
          echo "SMOKE_BASE_URL=https://$FQDN" >> "$GITHUB_ENV"

      - name: Wait for the new revision to be healthy
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SMOKE_BASE_URL/healthz" || true)
            if [ "$code" = "200" ]; then echo "Healthy after ${i} attempt(s)."; exit 0; fi
            echo "Attempt $i: /healthz returned '${code:-no response}', retrying..."
            sleep 5
          done
          echo "::error::New revision did not become healthy in time."
          exit 1

      - name: Smoke test the new revision
        run: pnpm test:e2e:smoke

      - name: Promote new revision (shift 100% traffic)
        run: |
          az containerapp ingress traffic set -n "$APP" -g "$RG" \
            --revision-weight "${NEW_REVISION}=100"
          echo "Promoted ${NEW_REVISION} to 100% traffic."
          if [ -n "$PREV_REVISION" ] && [ "$PREV_REVISION" != "$NEW_REVISION" ]; then
            az containerapp revision deactivate -n "$APP" -g "$RG" --revision "$PREV_REVISION" || true
            echo "Deactivated previous revision ${PREV_REVISION}."
          fi

      # Traffic is only shifted after a passing smoke test, so on failure prod is
      # still on the previous revision. This reasserts that and removes the bad one.
      - name: Rollback on failure
        if: failure()
        run: |
          echo "::warning::Deploy failed — rolling back."
          if [ -n "$PREV_REVISION" ]; then
            az containerapp ingress traffic set -n "$APP" -g "$RG" \
              --revision-weight "${PREV_REVISION}=100" || true
            echo "Traffic pinned to previous revision ${PREV_REVISION}."
          else
            echo "No previous revision recorded (first deploy?); nothing to roll back to."
          fi
          if [ -n "$NEW_REVISION" ]; then
            az containerapp revision deactivate -n "$APP" -g "$RG" --revision "$NEW_REVISION" || true
            echo "Deactivated failed revision ${NEW_REVISION}."
          fi

      - name: Upload smoke-test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
