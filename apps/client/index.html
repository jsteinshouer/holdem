<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2EEE6" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/friendly-holdem-icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/friendly-holdem-icon-192.png" />
    <title>Friendly Hold'em</title>
    <script>
      // Apply the theme before first paint to avoid a flash of the wrong palette.
      // Light is the default; only an explicit saved "dark" opts back into dark.
      try {
        if (localStorage.getItem("friendly-holdem:theme") !== "dark") {
          document.documentElement.dataset.theme = "light";
        }
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
