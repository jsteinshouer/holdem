# Local testing of the PRODUCTION container image (the exact artifact Azure runs).
#
# This is NOT the dev loop — use `pnpm dev` for Vite HMR + server watch.
# Use this to sanity-check the Docker build before `az containerapp up`.
#
#   docker compose up --build      # build + run, then open http://localhost:8080
#   curl http://localhost:8080/healthz
#   docker compose down            # stop
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # Mirrors the Azure default. Switch to "sqlite" (and enable the volume
      # below) to test persistence across container restarts locally.
      ACTIVE_TABLE_PERSISTENCE: "memory"
      # ACTIVE_TABLE_SQLITE_PATH: "/data/active-tables.sqlite"
    # Uncomment together with sqlite mode above to persist tables across restarts:
    # volumes:
    #   - holdem-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# volumes:
#   holdem-data:
