name: friendly-holdem-infra
runtime:
  name: nodejs
  options:
    typescript: true
description: >-
  One-time Azure infrastructure for Friendly Hold'em: resource group, Container
  Apps environment + app, and the Azure AD app registration + federated
  credential used by GitHub Actions OIDC. (The image lives in GHCR, not Azure.)

config:
  friendly-holdem-infra:location:
    description: Azure region for all resources.
    default: centralus
  friendly-holdem-infra:namePrefix:
    description: Prefix for resource names (RG, environment, container app).
    default: friendly-holdem
  friendly-holdem-infra:githubRepo:
    description: "GitHub repo (owner/name) trusted by the OIDC federated credential."
    default: jsteinshouer/holdem
  friendly-holdem-infra:githubBranch:
    description: Branch the CD workflow runs on (federated credential subject).
    default: main
  friendly-holdem-infra:githubSubjectPrefix:
    description: >-
      OIDC "sub" claim prefix. Defaults to repo:<githubRepo>. Newer GitHub
      accounts use an immutable prefix with numeric IDs
      (repo:<owner>@<id>/<repo>@<id>); get the exact value with
      `gh api /repos/<owner>/<repo>/actions/oidc/customization/sub --jq .sub_claim_prefix`.
